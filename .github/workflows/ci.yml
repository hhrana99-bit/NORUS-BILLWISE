name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-frontend:
    name: Frontend Lint, Test & Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run lint

      - name: Run service unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  verify-backend:
    name: Backend Compilation, Pytest & PostgreSQL 16 Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: norus_ci
          POSTGRES_PASSWORD: norus_ci_test_only_password
          POSTGRES_DB: norus_billwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U norus_ci -d norus_billwise_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      COOKIE_SECURE: 'false'
      JWT_SECRET_KEY: ci-only-non-production-jwt-signing-key-32-chars
      DATABASE_URL: postgresql+psycopg://norus_ci:norus_ci_test_only_password@localhost:5432/norus_billwise_test
      TEST_DATABASE_URL: postgresql+psycopg://norus_ci:norus_ci_test_only_password@localhost:5432/norus_billwise_test
      NORUS_REQUIRE_POSTGRES_TESTS: '1'
      NORUS_ALLOW_DESTRUCTIVE_MIGRATION_TEST: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Verify backend Python compilation
        working-directory: backend
        run: python -m compileall -q app alembic tests

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify NoDecode import and Settings initialization
        working-directory: backend
        run: >-
          python -c "from pydantic_settings import NoDecode;
          from app.core.config import get_settings;
          s = get_settings();
          assert NoDecode is not None;
          print('Validated DB target:', s.redacted_database_target())"

      - name: Run Alembic upgrade to head against PostgreSQL 16
        working-directory: backend
        run: alembic upgrade head

      - name: Run full backend pytest suite (including PostgreSQL 16 migration cycle)
        working-directory: backend
        run: pytest -v -ra
